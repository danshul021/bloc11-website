# Netlify builds the site with plain Node (no packages to install) every time content changes.
[build]
  command = "node build.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# lets other tools (e.g. Google Drive in the browser) read the site's public photos
[[headers]]
  for = "/images/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
