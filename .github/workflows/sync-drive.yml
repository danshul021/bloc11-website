# "Refresh from Drive" — started by the button on the admin page (or by hand from the Actions tab).
# Reads the Google Drive projects folder, copies new/changed photos in, adds new projects
# (hidden until switched on), and saves the result; Netlify then rebuilds the site.
name: Refresh from Drive

on:
  workflow_dispatch:

concurrency:
  group: sync-drive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the photo resizer
        run: npm install --no-save --no-package-lock sharp@0.33.5

      - name: Read the Drive folder
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY || secrets.WEBSITE_PROJECTS_DRIVE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TAG_MODEL: ${{ vars.TAG_MODEL }}
        run: node tools/sync-drive.mjs

      - name: Save changes
        run: |
          git config user.name "Bloc 11 website"
          git config user.email "info@bloc11.studio"
          git add -A content static/images/projects tools/drive-state.json
          if git diff --cached --quiet; then
            echo "Nothing changed in Drive."
            exit 0
          fi
          git commit -m "Refresh from Drive"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
